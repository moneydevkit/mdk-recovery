[package]
name = "mdk-recovery"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2"
bitcoin = { version = "0.32", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
esplora-client = { version = "0.12", default-features = false, features = [
    "async-https-rustls",
    "tokio",
] }
futures = "0.3"
lightning = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
assert_cmd = "2"
axum = "0.7"
corepc-node = { version = "0.10", features = ["29_0"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
