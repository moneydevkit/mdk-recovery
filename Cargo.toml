[package]
name = "mdk-recovery"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = "2"
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
esplora-client = { version = "0.12", default-features = false, features = [
    "async-https-rustls",
    "tokio",
] }
futures = "0.3"
lightning = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
