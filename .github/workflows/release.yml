name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compare tag to Cargo.toml version
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.triple }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: linux-x64
          - runner: ubuntu-24.04-arm
            triple: linux-arm64
          - runner: macos-latest
            triple: darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Build release binary
        run: nix build .#release --print-build-logs

      - name: Stage binary with triple-suffixed name
        run: cp result/bin/mdk-recovery mdk-recovery-${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mdk-recovery-${{ matrix.triple }}
          path: mdk-recovery-${{ matrix.triple }}

  # Cross-compile darwin-x64 from the arm64 runner with cargo + rustup.
  build-darwin-x64:
    name: Build (darwin-x64)
    needs: check-version
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Stage binary with triple-suffixed name
        run: cp target/x86_64-apple-darwin/release/mdk-recovery mdk-recovery-darwin-x64

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mdk-recovery-darwin-x64
          path: mdk-recovery-darwin-x64

  build-windows:
    name: Build (win32-x64)
    needs: check-version
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage binary with triple-suffixed name
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/mdk-recovery.exe mdk-recovery-win32-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mdk-recovery-win32-x64
          path: mdk-recovery-win32-x64.exe

  release:
    name: Sign and publish
    needs: [build, build-darwin-x64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          chmod +x mdk-recovery-*
          sha256sum mdk-recovery-* > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign manifest with minisign
        if: env.MINISIGN_KEY != ''
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_KEY" > minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix run nixpkgs#minisign -- -S -s minisign.key -m SHA256SUMS
          rm -f minisign.key

      - name: Bump npm package versions to match tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          # Pre-release tags (anything with a hyphen per semver, e.g.
          # 0.1.0-rc.1) publish under the `next` npm dist-tag so they
          # don't shadow `latest` for consumers of the meta package.
          if [[ "$VER" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
          for pkg in npm/cli npm/platform/*; do
            jq --arg v "$VER" '.version = $v' "$pkg/package.json" \
              > "$pkg/package.json.tmp"
            mv "$pkg/package.json.tmp" "$pkg/package.json"
          done
          jq --arg v "$VER" '
            .optionalDependencies = (.optionalDependencies | with_entries(.value = $v))
          ' npm/cli/package.json > npm/cli/package.json.tmp
          mv npm/cli/package.json.tmp npm/cli/package.json

      - name: Stage binaries into platform packages
        run: |
          for triple in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mkdir -p "npm/platform/${triple}/bin"
            cp "artifacts/mdk-recovery-${triple}" \
              "npm/platform/${triple}/bin/mdk-recovery-${triple}"
            chmod +x "npm/platform/${triple}/bin/mdk-recovery-${triple}"
          done
          mkdir -p npm/platform/win32-x64/bin
          cp artifacts/mdk-recovery-win32-x64.exe \
            npm/platform/win32-x64/bin/mdk-recovery-win32-x64.exe
          cp SHA256SUMS npm/cli/manifest/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          prerelease: ${{ env.NPM_TAG == 'next' }}
          files: |
            artifacts/mdk-recovery-*
            SHA256SUMS
            SHA256SUMS.minisig

      - name: Publish platform packages
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in npm/platform/*; do
            (cd "$pkg" && npm publish --access public --tag "$NPM_TAG")
          done

      - name: Publish meta package
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/cli && npm publish --access public --tag "$NPM_TAG"
