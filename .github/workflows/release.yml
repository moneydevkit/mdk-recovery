name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  tag:
    name: Tag release from Cargo.toml
    # Fires only when a release/* PR from this repo actually merges.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      sha: ${{ steps.derive.outputs.sha }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Derive version and guard the tag
        id: derive
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          BRANCH_VER="${GITHUB_HEAD_REF#release/v}"
          if [ "$VER" != "$BRANCH_VER" ]; then
            echo "::error::Cargo.toml ${VER} does not match branch release/v${BRANCH_VER}"
            exit 1
          fi
          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.derive.outputs.tag }}" "${{ steps.derive.outputs.sha }}"
          git push origin "${{ steps.derive.outputs.tag }}"

  build:
    name: Build (${{ matrix.triple }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: linux-x64
            flake-output: .#release
          - runner: ubuntu-24.04-arm
            triple: linux-arm64
            flake-output: .#release
          - runner: macos-latest
            triple: darwin-arm64
            flake-output: .#release
          - runner: macos-latest
            triple: darwin-x64
            flake-output: .#darwin-x64
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Build release binary
        run: nix build ${{ matrix.flake-output }} --print-build-logs

      - name: Stage binary with triple-suffixed name
        run: cp result/bin/mdk-recovery mdk-recovery-${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mdk-recovery-${{ matrix.triple }}
          path: mdk-recovery-${{ matrix.triple }}

  build-windows:
    name: Build (win32-x64)
    needs: tag
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage binary with triple-suffixed name
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/mdk-recovery.exe mdk-recovery-win32-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mdk-recovery-win32-x64
          path: mdk-recovery-win32-x64.exe

  release:
    name: Publish
    needs: [tag, build, build-windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#release --command bash -e {0}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          chmod +x mdk-recovery-*
          sha256sum mdk-recovery-* > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attest build provenance for release binaries
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "artifacts/mdk-recovery-*"

      - name: Bump npm package versions to match tag
        env:
          VERSION: ${{ needs.tag.outputs.tag }}
        run: |
          VER="${VERSION#v}"
          # Pre-release tags (anything with a hyphen per semver, e.g.
          # 0.1.0-rc.1) publish under the `next` npm dist-tag so they
          # don't shadow `latest` for consumers of the meta package.
          if [[ "$VER" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
          for pkg in npm/cli npm/platform/*; do
            jq --arg v "$VER" '.version = $v' "$pkg/package.json" \
              > "$pkg/package.json.tmp"
            mv "$pkg/package.json.tmp" "$pkg/package.json"
          done
          jq --arg v "$VER" '
            .optionalDependencies = (.optionalDependencies | with_entries(.value = $v))
          ' npm/cli/package.json > npm/cli/package.json.tmp
          mv npm/cli/package.json.tmp npm/cli/package.json

      - name: Stage binaries into platform packages
        run: |
          for triple in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mkdir -p "npm/platform/${triple}/bin"
            cp "artifacts/mdk-recovery-${triple}" \
              "npm/platform/${triple}/bin/mdk-recovery-${triple}"
            chmod +x "npm/platform/${triple}/bin/mdk-recovery-${triple}"
          done
          mkdir -p npm/platform/win32-x64/bin
          cp artifacts/mdk-recovery-win32-x64.exe \
            npm/platform/win32-x64/bin/mdk-recovery-win32-x64.exe
          mkdir -p npm/cli/manifest
          cp SHA256SUMS npm/cli/manifest/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ env.NPM_TAG == 'next' }}
          files: |
            artifacts/mdk-recovery-*
            SHA256SUMS

      - name: Publish platform packages
        run: |
          for pkg in npm/platform/*; do
            (cd "$pkg" && npm publish --access public --provenance --tag "$NPM_TAG")
          done

      - name: Publish meta package
        run: |
          cd npm/cli && npm publish --access public --provenance --tag "$NPM_TAG"
